<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found - Shumaya</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F7F2EA; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Manrope', sans-serif; color: #1A1714; text-align: center; padding: 40px 24px; }
  a { color: #DB6418; text-decoration: none; } a:hover { color: #b8500f; }
</style>
</head>
<body>
  <img src="shumaya-wordmark.png" alt="Shumaya" style="height: 36px; margin-bottom: 48px;" onerror="this.style.display='none'">

  <div style="font-weight: 800; font-size: 28px; margin-top: 16px; letter-spacing: -.02em;">Page not found</div>

  <a href="/" style="margin-top: 32px; display: inline-block; background: #DB6418; color: #1A1714; font-weight: 800; font-size: 15px; padding: 14px 36px; border-radius: 100px; transition: background .2s;" onmouseover="this.style.background='#b8500f'" onmouseout="this.style.background='#DB6418'">Back to Home</a>
